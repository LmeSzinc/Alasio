<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The Content-Security-Policy is owned by SvelteKit (`kit.csp`, hash
         mode): it writes the meta tag below with the hashes of the inline
         scripts it renders itself, and svelte.config.js supplies the hashes of
         the template script further down. The backend mirrors that meta into
         the response header. Do not add a CSP meta here: a second policy would
         be enforced on top of the generated one. The hashes are checked
         against this file by `scripts/csp/verify.js` after every build. -->
    %sveltekit.head%
    <script>
      // Embedded sessions: the host (webapp) passes its display theme in the
      // iframe URL (?theme=dark|light) together with the config value it
      // resolves to (?themeConfig=system|light|dark). Apply the display value
      // before the first paint so the embedded app opens already themed, and
      // persist the config value to mode-watcher's storage key (its default
      // modeStorageKey) so ModeWatcher's onMount initialization keeps the same
      // mode. Persisting the resolved value instead would pin the page to one
      // mode: a 'system' preference has to keep following the os.
      //
      // The display value is needed because mode-watcher's FOUC script is not
      // present in this SPA build (ssr/prerender disabled), and even when
      // present it only knows localStorage/system preference, which can differ
      // from the host config on first run. Remote sessions without the theme
      // param are unaffected (per-client behavior preserved).
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const theme = params.get("theme");
          if (theme === "light" || theme === "dark") {
            const root = document.documentElement;
            root.classList.toggle("dark", theme === "dark");
            root.style.colorScheme = theme;
            const config = params.get("themeConfig");
            const stored = config === "system" || config === "light" || config === "dark" ? config : theme;
            localStorage.setItem("mode-watcher-mode", stored);
          }
        } catch {}
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
