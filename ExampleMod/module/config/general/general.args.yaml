  args:
    N: true
    R: true
    SR: false
    SSR: false
    RetireAmount:
      value: retire_all
      option: [ retire_all, retire_10 ]

# A shop purchase plan: the order of the shelves, and for a shelf that opens a
# selection dialog, which item to pick from it (dt=filter-order-item with
# "option_dict"). The value is written "item-option", an item without a
# secondary option (Chip) is written as itself.
ShopDemo:
  args:
    BuyOrder:
      dt: filter-order-item
      value: PlateT4-gun > BookT3-red > Chip
      option: [ PlateT4, BookT3, PR, Chip ]
      option_dict:
        PlateT4: [ gun, general, torpedo, antiair, plane ]
        BookT3: [ red, blue, yellow ]
        PR: [ neptune, monarch, seattle, georgia ]
