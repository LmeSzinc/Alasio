appId: com.alasio.app
productName: Alasio
directories:
  output: release
  buildResources: resources
# Use the electron binary already installed in node_modules,
# so electron-builder never re-downloads electron on every package
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - package.json
electronLanguages:
  - en-US
win:
  target:
    - dir
  icon: resources/icon.png
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
