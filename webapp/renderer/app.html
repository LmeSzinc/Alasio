<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alasio</title>
    <!-- The Content-Security-Policy is owned by SvelteKit (`kit.csp`, hash
         mode): it writes the meta tag below with the hashes of the inline
         scripts it renders itself, and scripts/csp/config.ts supplies the
         hashes of the template script further down, including the frame-src
         that allows the embedded frontend at the local backend. Do not add a
         CSP meta here: a second policy would be enforced on top of the
         generated one. The hashes are checked against this file by
         `scripts/csp/verify.ts` after every build. -->
    %sveltekit.head%
    <script>
      // Apply the host display theme before the first paint. Without this
      // the document canvas is white until the CSS/JS bundle loads (the
      // BrowserWindow backgroundColor only covers the pre-HTML window).
      // The theme is read synchronously from the main process via the
      // preload sendSync bridge (preload runs before page scripts); the
      // root layout effect keeps it in sync afterwards.
      (() => {
        try {
          const theme = window.electronAPI?.getSharedStateSync()?.theme;
          if (theme === "light" || theme === "dark") {
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.style.colorScheme = theme;
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
