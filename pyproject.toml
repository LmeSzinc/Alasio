[build-system]
requires = [
    # 75.4.0 is the first setuptools that requires Python 3.9
    "setuptools>=61.0,<75.4 ; python_version < '3.9'",
    "setuptools>=61.0 ; python_version >= '3.9'",
    "msgspec",
]
build-backend = "setuptools.build_meta"

[project]
name = "alasio"
version = "2.0.0"
description = "Mobile game bot framework abstracted from AzurLaneAutoScript and StarRailCopilot"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LmeSzinc" }
]
dependencies = [
    # just to ensure not too old
    "exceptiongroup>=1",
    # just to ensure not too old
    "typing-extensions>=4",
    # msgspec version is limited because we have msgspec_error to parse errors
    # 0.18.6 is the last version that support python3.8
    "msgspec>=0.18.6,<=0.22.0",
    "msgspecerror>=0.22.0.0",
    # just to ensure not too old
    # 0.23.0 is the last version that support python3.8
    "zstandard>=0.23.0",
    # 6.x releases continue to support Python 3.8
    "PyYAML>=6.0",
    # httpx is no longer maintained, httpx2 is the pydantic fork of httpx
    # python 3.8 support comes from the py38deps backport wheels
    "httpx2>=2",
    # alasio/spider parses and builds urls with yarl
    "yarl>=1.9",
    # just to ensure not too old
    "psutil>=5.9",
    # alasio/log
    # rich version is limited because we patched rich.trackback to enable exceptiongroup tracebacks on py<3.11
    # 14.1.0 is the minimum version to have exceptiongroup support
    # see alasio/ext/backport/__init__.py patch_rich_traceback_extract()
    "rich>=14.1.0,<=15.0.0",
]

[project.optional-dependencies]
image = [
    # just to ensure not too old
    "numpy>=1.16",
    # use headless version by default, so alasio still works on server without GUI
    # in fact, all 4 opencv-python versions are supported
    # - opencv-python
    # - opencv-python-headless
    # - opencv-contrib-python
    # - opencv-contrib-python-headless
    "opencv-python-headless>=4.5",
]
backend = [
    # 0.17.3 is the last version that support python3.8
    "hypercorn>=0.17.3",
    # 0.27.0 is the last version that support python3.8
    "trio>=0.27.0",
    # 0.44.0 is the last version that support python3.8, the py38deps backport provides 1.8.0
    # the backend and tests support both
    "starlette>=0.44.0",
    # 2.9.0 is the last version that support python3.8
    "PyJWT>=2.9.0",
]
pack = [
    # tomllib is the standard library module of Python 3.11+, tomli is the
    # backport for the older versions, used to parse a pyproject.toml
    # 2.0.1 is the tomli version the standard library tomllib is based on
    "tomli>=2.0.1; python_version < '3.11'",
    # pyproject_metadata reads the wheel metadata. The wheel builder patches
    # its module level get_license() / get_license_files() / get_readme(),
    # which became module functions in 0.11.0
    # 0.12.1 is the last release supporting Python 3.8
    "pyproject-metadata>=0.11.0,<=0.12.1",
    # PEP 440 version and PEP 503 name normalization
    "packaging>=23.2",
]
test = [
    # pytest 7 added MonkeyPatch, and pytest 7 is the last version that supports py3.7
    # 8.3.4 is the last version that support python3.8
    "pytest>=8.3.4",
    # 0.8.0 is the latest version, pytest-trio is unchanged since 2022
    "pytest-trio>=0.8.0",
    # The tests drive the app through starlette.testclient, which speaks the
    # project http client (httpx2) from starlette 1.2 on. Older starlette
    # versions import httpx, whose exceptions are not httpx2 errors and break
    # the code under test. The runtime floor stays 0.44, a library that only
    # mounts the app never imports the test client.
    "starlette>=1.2.0",
    # just to ensure not too old
    "ruff>=0.16.0",
    # alasio/codegen/ruff/ruff_format.py requires isort>=5.2.0
    "isort>=5.2.0",
]
mod = ["alasio[image,backend]"]
all = ["alasio[image,backend,pack,test]"]

[tool.setuptools]
packages = ["alasio"]

[tool.pytest.ini_options]
# Disable the pyfakefs pytest plugin globally: the project implements its own
# in-memory fake filesystem (alasio.testing.filesystem.fs), and the plugin's
# "fs" fixture would silently inject pyfakefs into tests. The project fixture
# is imported explicitly in test modules, never registered by the plugin.
# The screenshot golden test harness is a pytest plugin too, it is loaded by
# module path instead of an installed entry point, so a plain checkout runs the
# tests without installing the package, see alasio/testing/screenshot.py.
addopts = ["-p", "no:fakefs", "-p", "no:tmpdir", "-p", "alasio.testing.screenshot"]
# Add the repository root to sys.path, so the plugin loaded above and the tests
# import alasio and ExampleMod from a plain checkout.
pythonpath = ["."]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require external network access (skip with '--run-network' unset)",
]
